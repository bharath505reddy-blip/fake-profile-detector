{% extends "base.html" %}
{% block title %}Error — {{ error_title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card border-danger shadow-sm rounded-4 mt-4">
      <div class="card-body text-center py-5 px-4">
        <div style="font-size:3rem;">&#9888;</div>
        <h3 class="text-danger mt-3 mb-2">{{ error_title }}</h3>
        <p class="text-muted mb-3">{{ error_message }}</p>

        {% if error_hint %}
        <div class="alert alert-warning text-start rounded-3 mb-4">
          <strong>How to fix:</strong> {{ error_hint }}
        </div>
        {% endif %}

        <a href="{{ url_for('index') }}" class="btn btn-primary">
          <i class="bi bi-house me-1"></i>Go to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
